name: Build ChoreoLib Artifacts

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          build-root-directory: ./choreolib

      - name: Build Library
        working-directory: ./choreolib
        # build triggers your copyAllOutputs task; publishToMavenLocal generates the POM files
        run: ./gradlew build publishToMavenLocal

      - name: Upload Flat Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChoreoLib-Files
          # Grabs the raw jars and zips your script copied here
          path: choreolib/build/allOutputs/

      - name: Upload Local Maven Repo
        uses: actions/upload-artifact@v4
        with:
          name: ChoreoLib-Maven-Repo
          # Grabs the structured Maven files so you can easily include them in another project
          path: ~/.m2/repository/
